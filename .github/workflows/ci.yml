name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins, so a run here
      # matches what a contributor gets locally.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci
        env:
          CI: true

      # A production build catches what neither lint nor the unit tests do:
      # a broken import, a missing asset, a chunk that fails to resolve.
      - name: Build
        run: npm run build
        env:
          CI: false
