<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="دين الله، مصدركم لمواضيع إسلامية متنوعة. نسعى لتقديم معلومات موثوقة وشاملة لتعزيز معرفتكم "
    />
    <meta property="og:title" content="موقع دين الله" />
    <meta property="og:type" content="Website" />
    <meta
      property="og:image"
      content="https://myislam-steel.vercel.app/logo192.png"
    />
    <meta property="og:url" content="https://myislam-steel.vercel.app/" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <!--
      Bootstrap's CSS and every webfont are bundled with the app now
      (see src/index.js and src/styles/fonts.js) rather than fetched from a
      CDN, so the first paint waits on nothing third-party and the installed
      PWA still renders correctly with no network.
    -->

    <title>دين الله</title>
  </head>
  <body class="custom-cursor">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      (function () {
        try {
          const theme = localStorage.getItem("theme"); // "dark" or "light"
          const bodyClass = localStorage.getItem("bodyClass"); // e.g., "sky", "image", etc.
          const fontTheme = localStorage.getItem("fontTheme") || "font-default";
          const language = localStorage.getItem("language") || "ar";

          // Applied before first paint so the page never flips direction.
          document.documentElement.lang = language;
          document.documentElement.dir = language === "en" ? "ltr" : "rtl";

          const body = document.body;
          if (language === "en") body.classList.add("en");

          if (theme === "dark") {
            body.classList.add("dark-mode");
          } else {
            body.classList.add("light-mode");
          }

          if (bodyClass) {
            body.classList.add(bodyClass);
          }

          body.classList.add(fontTheme);
        } catch (e) {
          console.warn("Theme preload failed:", e);
        }
      })();
    </script>
  </body>
</html>
